name: CI

on:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pnpm repo and voidzero
        id: pnpmi-vp
        uses: chlbri/node-github-actions/.github/actions/pnpmi-vp@main

      - name: Install
        run: vp install

      - name: Build
        run: vp run pretest

      - name: lint
        run: vp run lint

      - name: Test
        run: vp run test:only

      - name: Cleanup
        run: vp run posttest

      # `needs:` is not allowed on a step, so `always()` is the step-level
      # equivalent: the save is not blocked by an earlier failing step.
      # `continue-on-error` keeps a cache-save problem from failing the job.
      - name: Save Vite Task cache
        if: steps.pnpmi-vp.outputs.vite-task-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.pnpmi-vp.outputs.vite-task-cache-key }}
